#  port: 7070
spring:
  application:
    name: msv-wikimedia-producer
    version: "@project.version@"
  profiles:
    active: prod
  cloud:
    config:
      uri: ${CONFIG_SERVER:http://localhost:8888}
      fail-fast: true
  output:
    ansi:
      enabled: ALWAYS
eureka:
  client:
    service-url:
      defaultZone: ${EUREKA_SERVER:http://localhost:8761/eureka}  # URL del Discovery Server
    register-with-eureka: true
    fetch-registry: true
  instance:
    instance-id: ${spring.application.name}:${random.uuid}
    lease-expiration-duration-in-seconds: 5
    lease-renewal-interval-in-seconds: 3
logging:
  level:
#    root: TRACE   # Máximo detalle de logs
#    root: DEBUG   # Detalles de depuración
    root: INFO    # Información general
#    root: WARN    # Advertencias
#    root: ERROR   # Errores
#    root: OFF     # Sin logs